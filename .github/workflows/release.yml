name: Release

on:
  push:
    tags: ['v*']
    # Push a release/* branch to get installers as run artifacts without
    # cutting a tag; only tags publish an actual GitHub Release.
    branches: ['release/**']
  # Releasing by hand from the Actions tab. This exists because pushing a tag
  # is not always available — some environments the repository is worked on
  # from cannot push tag refs at all — and "the installers cannot be published
  # from here" is a bad reason for there to be no download.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v0.2.0. Leave empty to build without releasing.'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a prerelease (it will NOT be the download the links point at)'
        required: false
        # Ticked by default, this quietly broke every release cut from the
        # Actions tab: the page published fine and every download button on it
        # served an older release's installers, because /releases/latest/
        # skips prereleases. Typing a version tag is the act of releasing that
        # version, so that is what it now does unless this is ticked on
        # purpose.
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            # What this platform is expected to produce. Listing every
            # platform's patterns everywhere would mean each job either
            # tolerating files that are missing because another job makes
            # them, or failing on them.
            files: |
              release/*.pkg
              release/*.dmg
              release/*.zip
          - os: windows-latest
            target: --win
            files: |
              release/*.exe
          - os: ubuntu-latest
            target: --linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app bundle
        # electron-builder only packages dist/; without this it would happily
        # ship an installer containing an empty window.
        run: npm run build
      - name: Verify the bundle exists
        shell: bash
        run: test -f dist/index.html

      # The tag and the version inside the application have to agree.
      #
      # They drifted once — a release tagged v0.7.1 built from a package.json
      # that still said 0.7.0 — and nothing anywhere would have noticed. What
      # people download reports its own version in the About box and in the
      # scene files it writes, so a mismatch is a support question nobody can
      # answer.
      - name: The tag and package.json must agree
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          want="${tag#v}"
          have="$(node -p "require('./package.json').version")"
          echo "tag $tag wants $want; package.json says $have"
          [ "$want" = "$have" ] || {
            echo "::error::releasing $tag from a build that calls itself $have"
            exit 1
          }

      # Everything the depth feature needs has to be inside the bundle, or the
      # feature is a button that produces an error message on a machine with
      # no network. These are copied from public/ by the build; if that ever
      # stops happening the installers should not go out.
      - name: The depth model and its runtime must be packaged
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/models/depth-anything-v2-small-int8.onnx
          test -f dist/ort/ort-wasm-simd-threaded.wasm
          test -f THIRD-PARTY-NOTICES.md
          test -f licences/Apache-2.0.txt
          echo "model $(du -h dist/models/*.onnx | cut -f1), runtime $(du -h dist/ort/*.wasm | cut -f1)"
      # A release whose builds enforce nothing, beside a README and a LICENCE
      # promising a fourteen-day trial, is the two halves of the product
      # contradicting each other in public. v0.10.0 went out exactly that way:
      # the installers were cut five commits before the signing key was
      # installed, so every copy was ungated for ever while the licence said
      # otherwise. A tagged release now refuses to build without the key.
      - name: A tagged release must carry a signing key
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          key="$(node -e "
            const s = require('fs').readFileSync('src/licence/licence.ts', 'utf8');
            const m = s.match(/PUBLIC_KEY_SPKI = '([^']*)'/);
            process.stdout.write(m ? m[1] : '');
          ")"
          if [ -z "$key" ]; then
            echo "::error::PUBLIC_KEY_SPKI is empty, so these installers would enforce no licence at all while the LICENCE promises a trial. Run tools/kline-licence.mjs keygen and install the public key before tagging."
            exit 1
          fi
          echo "signing key present (${#key} chars)"
          # And it has to survive into the bundle, not merely into the source.
          grep -qF "$key" dist/assets/*.js || {
            echo "::error::the signing key is in the source but not in the built bundle"
            exit 1
          }
          echo "signing key is present in the built bundle"

      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds: skip notarisation rather than failing the job.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The macOS app shipped for months without ever being launched, because
      # nothing here could launch it: it is built on a machine nobody looks at
      # and downloaded by someone else entirely. An arm64 binary with no
      # signature is refused by the kernel outright — "Kline is damaged and
      # can't be opened" — and that was invisible from the build log, which
      # said "success". These runners are real Macs, so the app is now made to
      # start on one before anybody is offered it.
      - name: Prove the macOS app actually launches
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          fail=0
          for app in release/mac-arm64/Kline.app release/mac/Kline.app release/mac-universal/Kline.app; do
            [ -d "$app" ] || continue
            echo "===================================================== $app"

            # A signature has to be present and internally consistent. --strict
            # is the part that catches a bundle signed before something else
            # was written into it.
            codesign --verify --deep --strict --verbose=2 "$app" || { echo "SIGNATURE INVALID"; fail=1; }
            codesign --display --verbose=2 "$app" 2>&1 | sed 's/^/    /' || true

            # What Gatekeeper thinks. An ad-hoc signature is expected to be
            # rejected here — that is the one-time right-click -> Open — so
            # this is reported rather than enforced.
            spctl --assess --type execute --verbose=4 "$app" 2>&1 | sed 's/^/    /' || true

            # The part that matters: does it run. The app boots, screenshots
            # itself and exits; no screenshot means it never got that far.
            shot="$RUNNER_TEMP/$(basename "$(dirname "$app")").png"
            binary="$app/Contents/MacOS/Kline"
            [ -x "$binary" ] || { echo "NO EXECUTABLE AT $binary"; fail=1; continue; }
            arch_of=$(lipo -archs "$binary" 2>/dev/null || echo unknown)
            echo "    architectures: $arch_of"

            # These runners are arm64 and have no Rosetta, so an x64-only build
            # cannot be started here. Reporting that as a failure would be the
            # test lying about the app, so it is checked as far as it can be
            # and then left; the universal and arm64 builds are the ones an
            # Apple Silicon user actually runs.
            if ! echo "$arch_of" | grep -qE 'arm64|$(uname -m)'; then
              echo "    not runnable on this $(uname -m) runner — signature checked only"
              continue
            fi

            if KLINE_SMOKE="$shot" "$binary" 2>&1 | sed 's/^/    /'; then
              if [ -s "$shot" ]; then
                echo "    LAUNCHED — rendered $(wc -c < "$shot") bytes"
              else
                echo "    STARTED BUT NEVER RENDERED"; fail=1
              fi
            else
              echo "    FAILED TO LAUNCH"; fail=1
            fi
          done
          exit "$fail"

      # What opening the .dmg actually shows.
      #
      # This is the first thing anybody sees, and until now nothing checked
      # it: the layout is written into a .DS_Store inside the image, and the
      # only way to know what ended up there is to mount the image and look.
      # A disk image that opens onto the wrong things is not a small problem —
      # it is the step where somebody decides the application is broken and
      # stops, and the last time it went wrong the person downloaded the
      # source code zip instead and could not understand why nothing ran.
      - name: Prove the disk image opens onto the app and Applications
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "===================================================== $dmg"
            mount="$(mktemp -d)"
            # -nobrowse so the runner's Finder does not take an interest and
            # hold the volume open when we come to unmount it.
            hdiutil attach -nobrowse -readonly -noautoopen "$dmg" -mountpoint "$mount" >/dev/null

            visible=()
            while IFS= read -r line; do visible+=("$line"); done < <(ls "$mount" | sort)
            echo "    window shows: ${visible[*]}"
            echo "    everything:   $(ls -A "$mount" | sort | tr '\n' ' ')"

            if [ "${#visible[@]}" -ne 2 ]; then
              echo "    WRONG: ${#visible[@]} things in the window, expected exactly 2"; fail=1
            fi
            [ -d "$mount/Kline.app" ] || { echo "    WRONG: no Kline.app to drag"; fail=1; }
            [ -L "$mount/Applications" ] || { echo "    WRONG: no Applications shortcut to drag onto"; fail=1; }
            target="$(readlink "$mount/Applications" 2>/dev/null || true)"
            [ "$target" = "/Applications" ] || { echo "    WRONG: Applications points at '$target'"; fail=1; }
            # The icon positions live here. No .DS_Store means the window opens
            # on whatever Finder feels like rather than the two-icon layout.
            [ -f "$mount/.DS_Store" ] || { echo "    WRONG: no layout was written into the image"; fail=1; }

            hdiutil detach "$mount" -quiet || hdiutil detach "$mount" -force -quiet || true
          done
          exit "$fail"

      # Windows was the one platform whose packaged application was never
      # started before it went out. It is also the one most people download.
      # electron-builder leaves an unpacked tree beside the installers, which
      # is the same application the installer places — so it is run here, put
      # through the same piece of real work as everywhere else, and made to
      # exit zero before anybody is offered it.
      - name: Prove the Windows app actually launches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path release -Recurse -Filter Kline.exe |
                 Where-Object { $_.FullName -match 'win-unpacked|win-ia32-unpacked|win-arm64-unpacked' } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error 'no unpacked Kline.exe to launch'; exit 1 }
          Write-Host "launching $($exe.FullName)"

          $shot = Join-Path $env:RUNNER_TEMP 'windows-launch.png'
          $out  = Join-Path $env:RUNNER_TEMP 'windows-launch.out'
          $err  = Join-Path $env:RUNNER_TEMP 'windows-launch.err'
          $env:KLINE_SMOKE = $shot

          # Chromium writes GPU and D-Bus warnings to stderr on every start.
          # Merging that into the success stream while ErrorActionPreference is
          # Stop would abort this step on the first harmless one, so the two
          # streams go to files and are printed afterwards. Start-Process with
          # -Wait -PassThru is also the reliable way to get an exit code out of
          # a windowed application.
          $p = Start-Process -FilePath $exe.FullName `
                 -ArgumentList '--enable-unsafe-swiftshader','--use-angle=swiftshader' `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host "    $_" } }
          if (Test-Path $err) {
            Get-Content $err | Select-Object -First 40 | ForEach-Object { Write-Host "    [stderr] $_" }
          }

          if ($p.ExitCode -ne 0) {
            Write-Error "the packaged app exited $($p.ExitCode) — its own checks failed"
            exit 1
          }
          if (-not (Test-Path $shot)) { Write-Error 'it started but never rendered'; exit 1 }
          Write-Host "LAUNCHED — rendered $((Get-Item $shot).Length) bytes"

      - name: Keep the screenshot the Windows app took of itself
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-proof
          path: ${{ runner.temp }}/windows-launch.png
          if-no-files-found: warn
          retention-days: 7

      # The Linux AppImage, likewise: extracted and run under a virtual
      # display, because an AppImage that will not start is invisible from a
      # build log that says "success".
      - name: Prove the Linux AppImage actually launches
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # xvfb only. --appimage-extract unpacks without mounting, so FUSE is
          # not needed — and libfuse2 is not installable by that name on every
          # runner image, which would fail the step for the wrong reason.
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          shopt -s nullglob
          fail=0
          for image in release/*.AppImage; do
            echo "===================================================== $image"
            chmod +x "$image"
            full="$(readlink -f "$image")"
            work="$(mktemp -d)"
            (cd "$work" && "$full" --appimage-extract >/dev/null)
            binary="$work/squashfs-root/kline"
            [ -x "$binary" ] || { echo "    NO EXECUTABLE INSIDE"; fail=1; continue; }
            shot="$RUNNER_TEMP/linux-launch.png"
            if KLINE_SMOKE="$shot" xvfb-run -a "$binary" --no-sandbox \
                 --enable-unsafe-swiftshader --use-angle=swiftshader 2>&1 | sed 's/^/    /'; then
              [ -s "$shot" ] && echo "    LAUNCHED — rendered $(wc -c < "$shot") bytes" \
                || { echo "    STARTED BUT NEVER RENDERED"; fail=1; }
            else
              echo "    FAILED ITS OWN CHECKS"; fail=1
            fi
          done
          exit "$fail"

      - name: Keep the screenshot the Linux app took of itself
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-launch-proof
          path: ${{ runner.temp }}/linux-launch.png
          if-no-files-found: warn
          retention-days: 7

      - name: Keep the screenshots the macOS app took of itself
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-launch-proof
          path: ${{ runner.temp }}/*.png
          if-no-files-found: warn
          retention-days: 7
      # Each platform uploads its own installers straight to the release.
      #
      # These used to go into workflow artifacts for a separate job to collect
      # and re-upload, which stored every installer twice — once as an artifact
      # and once as a release asset — for a set of files that is well over half
      # a gigabyte per run. A few builds in one evening was enough to exhaust
      # the account's artifact storage, at which point every job failed on the
      # upload and no release came out at all, however well the app itself had
      # built. Publishing from here keeps one copy, in the place people
      # actually download from.
      - name: Publish the installers
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || startsWith(github.ref, 'refs/heads/release/')
          || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('kline-{0}', github.sha) }}
          # Without this the tag is cut against the default branch, so the
          # auto-attached "Source code" zip contains that branch, not the code
          # these installers were actually built from.
          target_commitish: ${{ github.sha }}
          name: ${{ (inputs.tag && format('Kline {0}', inputs.tag)) || (startsWith(github.ref, 'refs/tags/') && format('Kline {0}', github.ref_name)) || 'Kline (unreleased build)' }}
          # `A && B || C` reads as "B if A, else C", so asking for a full
          # release from the Actions tab made B false and handed the decision
          # to C — which is true on a branch — and published it as a
          # prerelease anyway. That matters more than it looks: GitHub's
          # /releases/latest/ endpoint skips prereleases, so the permanent
          # download links in the README resolve to nothing until a release
          # is marked full.
          prerelease: >-
            ${{ (inputs.tag != '' && inputs.prerelease)
                || (inputs.tag == '' && !startsWith(github.ref, 'refs/tags/')) }}
          # Three jobs write to one release, so each must add its own files
          # rather than replace what the others put there.
          append_body: false
          # Restructuring this step lost the notes once, and a release page
          # with no instructions on it sends people to the "Source code" link
          # — which is the repository, not the app.
          body: |
            ## Download

            **Do not click "Source code" at the bottom — that is the
            repository, not the app.**

            | | |
            |---|---|
            | **macOS - Apple Silicon** (M1/M2/M3/M4) | **[Kline-arm64.dmg](https://github.com/22500107Zc/Kline/releases/latest/download/Kline-arm64.dmg)** |
            | **macOS - Intel** | **[Kline-x64.dmg](https://github.com/22500107Zc/Kline/releases/latest/download/Kline-x64.dmg)** |
            | **macOS - installer** (either chip) | [Kline-universal.pkg](https://github.com/22500107Zc/Kline/releases/latest/download/Kline-universal.pkg) |
            | **Windows** | **[Kline-Setup.exe](https://github.com/22500107Zc/Kline/releases/latest/download/Kline-Setup.exe)** - [portable](https://github.com/22500107Zc/Kline/releases/latest/download/Kline-portable.exe) |
            | **Linux** | **[Kline.AppImage](https://github.com/22500107Zc/Kline/releases/latest/download/Kline.AppImage)** - [.deb](https://github.com/22500107Zc/Kline/releases/latest/download/Kline.deb) |

            ### First launch

            These are not signed by a paid developer account, so each system
            asks once whether you meant it. Once, not every time.

            **macOS** - open the `.dmg`, drag Kline to Applications, then
            **right-click Kline -> Open -> Open**. Double-clicking will not
            work the first time; the right-click is what offers the Open
            button. If it says the app **"is damaged and can't be opened"**,
            that is the quarantine flag macOS puts on downloaded unsigned
            apps, not a broken file:

            ```
            xattr -dr com.apple.quarantine /Applications/Kline.app
            ```

            **Windows** - SmartScreen: **More info** -> **Run anyway**.

            **Linux** - `chmod +x Kline.AppImage`, then run it.

            ### Scene files

            Kline saves `.kline` files, and still opens the `.kiln` files
            written before the rename.

            ### Built from

            Commit `${{ github.sha }}`.

            Three jobs write to this page and each one states the commit it
            built from, so a release assembled out of two different runs says
            so instead of looking like one thing.
          files: ${{ matrix.files }}
          # Each job asks only for its own platform's files, so an empty match
          # means that platform silently produced nothing — worth failing over.
          fail_on_unmatched_files: true

