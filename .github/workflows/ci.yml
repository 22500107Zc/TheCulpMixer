name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite takes about five minutes. Twice this run hung on the test step
    # and sat there — a job with no timeout runs for six hours before GitHub
    # kills it, which reads as "still running" rather than "broken" for most of
    # a working day. Twenty-five minutes is generous and still fails loudly.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser half of the suite needs a real Chromium. Without one it
      # used to skip itself and the job went green having run none of the
      # tests that look at the screen.
      - name: Install the browser the interaction tests need
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and browser tests
        run: npm test
      - name: Production build
        run: npx vite build

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Smoke-test the desktop shell
        # Boots the real Electron app under a virtual display and puts it
        # through a piece of real work — model, unwrap, undo, rig with an IK
        # constraint, keyframe, save and reopen — before screenshotting itself
        # and exiting. It exits non-zero when any of that fails, which is what
        # makes it a test rather than a picture: a build that renders a window
        # and then throws on the first operation used to pass.
        run: xvfb-run -a npx electron . --no-sandbox --enable-unsafe-swiftshader
        env:
          CULPMIXER_SMOKE: ${{ runner.temp }}/culpmixer-desktop.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-screenshot
          path: ${{ runner.temp }}/culpmixer-desktop.png
